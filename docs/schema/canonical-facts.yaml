# Canonical connector-fact schema registry (ADR-CONVERGENCE-001 P0-4).
#
# Single source of truth for the columns each connector fact MUST carry, per
# store. The PG hot-mirror is intentionally a SUBSET of the CH OLAP fact (it
# sizes for the metric-engine inputs), so the projection is declared PER STORE
# rather than asserting PG == CH. Column NAMES legitimately differ across stores
# (e.g. PG total_discount_mu ↔ CH discount_mu; PG unit_price_mu ↔ CH price_mu);
# the registry records the per-store name so drift (a dropped/renamed column)
# fails the CI gate `tests/conformance/check_fact_schema_drift.py`.
#
# `must_columns` are the load-bearing columns (money, join keys, partition keys)
# the read path depends on — NOT the exhaustive column list. Adding the check
# here is cheap insurance against the class of bug that shipped vendor_product_id
# missing (zeroed COGS/CM1 + 500s) and the net/discount name drift.

facts:
  connector_order_facts:
    pg:
      ddl: [apps/core-service/migrations/local-dev/05-schema-connector-facts.sql, apps/core-service/migrations/local-dev/10-schema-variants-and-extensions.sql]
      table: connector_order_facts_hot
      must_columns: [workspace_id, vendor, vendor_order_id, gross_sales_mu, total_discount_mu, total_tax_mu, shipping_mu, total_refund_mu, customer_ref, payment_method, is_cod, financial_status, cancelled_at, processed_at]
    ch:
      ddl: [apps/analytics-service/migrations/clickhouse/0003_connector_order_facts.sql]
      table: connector_order_facts
      must_columns: [workspace_id, vendor, vendor_order_id, gross_sales_mu, discount_mu, tax_mu, shipping_mu, net_sales_mu, total_refund_mu, customer_ref, payment_method, is_cod, financial_status, cancelled_at, order_date, version]

  connector_line_item_facts:
    pg:
      ddl: [apps/core-service/migrations/local-dev/05-schema-connector-facts.sql, apps/core-service/migrations/local-dev/29-line-item-vendor-product-id.sql]
      table: connector_line_item_facts_hot
      must_columns: [workspace_id, vendor, vendor_order_id, vendor_line_id, vendor_product_id, sku, quantity, unit_price_mu]
    ch:
      ddl: [apps/analytics-service/migrations/clickhouse/0004_connector_line_item_facts.sql]
      table: connector_line_item_facts
      must_columns: [workspace_id, vendor, vendor_order_id, vendor_line_id, vendor_product_id, sku, quantity, price_mu, line_total_mu, order_date, version]

  connector_ad_spend_facts:
    pg:
      ddl: [apps/core-service/migrations/local-dev/05-schema-connector-facts.sql]
      table: connector_ad_spend_facts
      must_columns: [workspace_id, vendor, campaign_id, spend_date, spend_mu, impressions, clicks]
    ch:
      ddl: [apps/analytics-service/migrations/clickhouse/0006_connector_ad_facts.sql]
      table: connector_ad_spend_facts
      must_columns: [workspace_id, vendor, campaign_id, date, spend_mu, impressions, clicks, conversions, revenue_mu, version]

  connector_shipment_facts:
    ch:
      ddl: [apps/analytics-service/migrations/clickhouse/0007_connector_logistics_facts.sql, apps/analytics-service/migrations/clickhouse/0011_shipment_cod_payment_columns.sql]
      table: connector_shipment_facts
      must_columns: [workspace_id, vendor, vendor_shipment_id, vendor_order_id, status, courier_name, delivery_pincode, is_rto, is_cod, payment_method, date, version]

  connector_product_facts:
    ch:
      ddl: [apps/analytics-service/migrations/clickhouse/0005_connector_product_and_variant_facts.sql]
      table: connector_product_facts
      must_columns: [workspace_id, vendor, vendor_product_id, cost_mu, version]
