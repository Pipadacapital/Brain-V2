# Canonical connector-fact schema registry (ADR-CONVERGENCE-001 P0-4, P0-A full-column hardening).
#
# Single source of truth for the columns each connector fact MUST carry, per
# store. The PG hot-mirror is intentionally a SUBSET of the CH OLAP fact (it
# sizes for the metric-engine inputs), so the projection is declared PER STORE
# rather than asserting PG == CH. Column NAMES legitimately differ across stores
# (e.g. PG total_discount_mu ↔ CH discount_mu; PG unit_price_mu ↔ CH price_mu);
# the registry records the per-store name so drift (a dropped/renamed column)
# fails the CI gate `tests/conformance/check_fact_schema_drift.py`.
#
# P0-A hardening (ADR-CONVERGENCE-001 P0-A task 4):
#   `must_columns` → required load-bearing columns (money, join keys, partition keys).
#   `all_columns`  → FULL column list per DDL; the hardened drift gate checks
#                    that every column declared in the DDL is registered here AND
#                    every column here appears in the DDL. This bidirectional check
#                    catches a dropped column OR a column added to the DDL without
#                    updating the registry.
#
# All 11 silver fact tables are now registered (P0-A: was 5 ungated, now 11 gated).
# connector_raw_events is BRONZE (append-only, not a typed fact) — not registered here.

