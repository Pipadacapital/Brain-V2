[project]
name = "brain_llm"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "LLM client surface routed via the LiteLLM gateway (spec: pylibs/brain_llm). Model-agnostic; all calls go through the gateway (small_llm/frontier_llm tiers), never the raw vendor SDK. Consumed by intelligence-service (Phase-2 build)."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
