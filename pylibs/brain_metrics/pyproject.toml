[project]
name = "brain_metrics"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "Metric registry — Python half of the TS↔Python parity pair (counterpart: packages/lib-metrics). All metric names, types, and units defined here must mirror @brain/lib-metrics. Parity enforced by check:metrics-parity CI task (tools/check-metrics-parity.sh)."
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
