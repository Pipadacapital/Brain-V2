[project]
name = "ingestion-service"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "Shopify/Unicommerce/MoEngage connector ingestion pipeline. Phase 0-1 deployable. uv workspace member."
dependencies = [
  # Shared structured JSON logger + correlation (pylibs/brain_logger).
  "brain-logger",
  "psycopg[binary,pool]>=3.3.4",
  "aiokafka>=0.14.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "boto3>=1.38.0",
  # ClickHouse client — raw-archiver consumer (P0-C) and BACKUP cron write to CH.
  # Aligns with analytics-service's clickhouse-connect version.
  "clickhouse-connect>=0.8.0",
  # gRPC transport for the internal WebhookIngest service (T2 — Track 2, connector-webhook-intake).
  # Justified: gRPC is the chosen internal transport (Option C ruling, Aryan §3).
  # Smaller than Option B (no FastAPI/uvicorn added).
  # grpcio-health-checking adds the gRPC standard health service for readiness checks.
  "grpcio>=1.68.0,<2.0.0",
  "grpcio-health-checking>=1.68.0,<2.0.0",
]

# brain-logger is a uv workspace member — resolve from the workspace, not PyPI.
[tool.uv.sources]
brain-logger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Without this, hatchling cannot infer the package dir (code lives flat under
# src/) and `uv run pytest` fails to build the project — the suite was dark.
# Mirrors analytics-service / intelligence-service.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.3.0",
  "testcontainers[postgres,kafka]>=4.14.2",
  "moto[secretsmanager]>=5.1.0",
  # grpcio-tools: generates ingestion_pb2.py + ingestion_pb2_grpc.py for the grpcio server path.
  # Stubs are committed into src/interfaces/grpc/_pb2/ (reproducible, no codegen step at test time).
  # grpcio-tools version must stay aligned with the grpcio runtime dep above.
  "grpcio-tools>=1.68.0,<2.0.0",
]
