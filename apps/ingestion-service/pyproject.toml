[project]
name = "ingestion-service"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "Shopify/Unicommerce/MoEngage connector ingestion pipeline. Phase 0-1 deployable. uv workspace member."
dependencies = [
  "psycopg[binary,pool]>=3.3.4",
  "aiokafka>=0.14.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "boto3>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.3.0",
  "testcontainers[postgres,kafka]>=4.14.2",
  "moto[secretsmanager]>=5.1.0",
]
