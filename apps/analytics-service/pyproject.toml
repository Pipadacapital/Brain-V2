[project]
name = "analytics-service"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
description = "Metric engine, ClickHouse query layer, Decision-Log writer, RTO/COD/GST analytics over integer minor-unit inputs. Phase 0-1 deployable. uv workspace member."
dependencies = [
  # Shared structured JSON logger + correlation (pylibs/brain_logger).
  "brain-logger",
  # Metric registry (brain_metrics.registry) + cost/paradigm gate — imported by the
  # query modules + servicer. Previously UNDECLARED: worked only in the all-packages
  # dev venv; the per-service Docker `uv sync --package` would omit them and the
  # container would ImportError on the first metric query. Declared now (workspace).
  "brain-metrics",
  "brain-cost-router",
  # ClickHouse OLAP driver — the query gateway (infrastructure/clickhouse) speaks this.
  "clickhouse-connect>=0.8.0",
  # Postgres v3 — the read-only-role startup probe connects with this (psycopg, not psycopg2).
  "psycopg[binary]>=3.3.4",
  # Internal gRPC server transport (health surface in PA-2a; MetricsService servicer later).
  "grpcio>=1.68.0,<2.0.0",
  "grpcio-health-checking>=1.68.0,<2.0.0",
]

# Workspace members — resolve from the workspace, not PyPI.
[tool.uv.sources]
brain-logger = { workspace = true }
brain-metrics = { workspace = true }
brain-cost-router = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# grpcio-tools: generates _pb2.py + _pb2_grpc.py stubs from .proto files.
# Run: uv run --with grpcio-tools python -m grpc_tools.protoc ... (see ADR-0001 Step 0).
# Stubs are committed at src/interfaces/grpc/_pb2/ — not generated at build time.
[dependency-groups]
dev = ["grpcio-tools>=1.80.0,<2.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
