# Brain — design-conformance manifest (LLD §7).
#
# The human-readable index of the C1–C14 invariants. run_conformance.py is the
# AUTHORITATIVE executor; this file documents what each check asserts, its kind,
# and whether it blocks the gate. Each Cn was ratified by the architect (Aryan) on
# 2026-06-01 to assert Brain's ACTUAL (evolved) invariants, not the literal LLD
# table names — see docs/lld-amendment-2026-06-01.md.
#
# kind:     static = deterministic file/DDL scan (always runs)
#           behavioral = shells out to an existing killed-mutant gate (--with-behavioral)
# blocking: true = a FAIL fails CI; false = advisory (WARN, tracked debt)

suite: brain-design-conformance
version: 1
run: "python tests/conformance/run_conformance.py [--with-behavioral] [--json]"

checks:
  - id: C1
    invariant: "Money is integer minor-units (never float/NUMERIC)"
    kind: static
    blocking: true
    impl: check_money_types.py
  - id: C2
    invariant: "Every ClickHouse table ORDER BY leads with workspace_id"
    kind: static
    blocking: true
    impl: check_clickhouse.py
  - id: C3
    invariant: "Every workspace-scoped PG table has fail-closed RLS"
    kind: static
    blocking: true
    impl: check_rls.py
    allowlist:
      cross_brand_pattern: "k-anonymity cohort aggregate; no workspace_id"
      connector_identity_map: "system-scoped pre-workspace lookup that produces workspace_id"
  - id: C4
    invariant: "ClickHouse query gateway is fail-closed (UnscopedQueryError)"
    kind: behavioral
    blocking: true
    command: "python -m pytest -q tests/test_query_gateway_isolation.py  (cwd apps/analytics-service)"
  - id: C5
    invariant: "Metric registry TS<->Python byte-parity (killed-mutant)"
    kind: behavioral
    blocking: true
    command: "bash tools/check-metrics-parity.sh"
  - id: C6
    invariant: "ai.decision_log is append-only (BEFORE UPDATE trigger raises)"
    kind: static
    blocking: true
    impl: check_decision_log.py
  - id: C7
    invariant: "ai.decision_log idempotency key UNIQUE(workspace_id, agent_id, input_hash)"
    kind: static
    blocking: true
    impl: check_decision_log.py
  - id: C8
    invariant: "@paradigm gate enforced at runtime (sql/ml may not reach the LLM gateway)"
    kind: behavioral
    blocking: true
    command: "python -m pytest -q tests/unit/test_gate1_paradigm.py  (cwd apps/intelligence-service)"
  - id: C9
    invariant: "LLM access is LiteLLM-gateway-only (no direct vendor SDK)"
    kind: static
    blocking: true
    impl: check_llm_gateway.py
  - id: C10
    invariant: "Pagination is cursor-only (OFFSET banned in prod read paths)"
    kind: static
    blocking: true
    impl: check_pagination.py
    status: "GREEN — store-browser (orders/products/customers) converted to keyset/seek
      pagination (O(1) deep pages, no OFFSET). The COGS editor keeps a bounded OFFSET as a
      RATIFIED permanent exception. OFFSET in any NON-allowlisted file still fails (non-vacuous)."
    allowlist:
      apps/core-service/src/application/contexts/product-cogs/product-cogs-use-cases.ts:
        "COGS editor admin table; bounded OFFSET (MAX_OFFSET) — ratified permanent exception"
    expires_with: "ratified (Mixed-model: keyset for store-browser; bounded cap for COGS)"
  - id: C11
    invariant: "DDD layering — no controllers/models/managers/helpers dirs"
    kind: static
    blocking: true
    impl: check_layering.py
  - id: C12
    invariant: "Per-service DB isolation by GRANT — per-service roles+grants exist, correctly
      scoped (no mis-grant), and no cross-service raw-SQL FROM. BLOCKING since A4."
    kind: static
    blocking: true
    impl: check_rls.py
    proof: "tests/integration/db-isolation/run.sh — deny-matrix vs disposable Postgres (11/11)"
  - id: C13
    invariant: "Cross-brand memory k-anonymity (brand_count >= 5 CHECK)"
    kind: static
    blocking: true
    impl: check_memory.py
  - id: C14
    invariant: "Single pgvector HNSW opclass repo-wide (cosine) + decision_log correlation quad"
    kind: static
    blocking: true
    impl: check_memory.py
