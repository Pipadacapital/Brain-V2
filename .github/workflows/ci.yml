# =============================================================================
# Brain CI — architectural invariant gates (Phase-A slice A3).
#
# The `invariant-gates` job is the BLOCKING gate: it runs the C1–C14
# design-conformance suite WITH behavioral checks, which transitively executes:
#   - metric registry TS<->Python byte-parity   (C5 → tools/check-metrics-parity.sh)
#   - ClickHouse query-gateway fail-closed       (C4 → analytics pytest)
#   - @paradigm runtime enforcement              (C8 → intelligence pytest)
#   - + the 11 static schema/DDD/money/RLS/opclass/OFFSET invariants (C1–C3,6,7,9–14)
# One command, fully self-contained (shells out to uv/bash). Verified green locally:
# `python3 tests/conformance/run_conformance.py --with-behavioral` → 14 PASS / 0 FAIL.
#
# The `typecheck` job is BLOCKING: `tsc --noEmit` across the backend TS packages +
# libs (api-gateway, core-service have real builds; the rest are stubs). web/mobile
# are excluded for now (their builds need NEXT_PUBLIC build-args / Expo config — a
# tracked follow-up to fold in). (A fuller static @paradigm audit — assert every
# endpoint/agent declares @paradigm — is a tracked follow-up beyond the C8 gate.)
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [development, release, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariant-gates:
    name: Architectural invariant gates (C1–C14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
        env:
          # Match the service Dockerfiles: pnpm v10+ blocks build scripts in
          # non-interactive mode; allow native builds (esbuild/tsx) in CI.
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"

      - name: Design-conformance + parity + paradigm + tenancy gates (C1–C14)
        run: python3 tests/conformance/run_conformance.py --with-behavioral

      # Fact-schema drift gate (ADR-CONVERGENCE-001 P0-4): every connector fact's
      # canonical money/join/partition columns must still be declared in each
      # store's DDL. Static (no DB); uv provisions PyYAML ephemerally.
      - name: Fact-schema drift gate (PG↔CH canonical columns)
        run: uv run --with pyyaml python tests/conformance/check_fact_schema_drift.py

  typecheck:
    name: Backend typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      - name: turbo build (tsc --noEmit) — backend + libs, excludes web/mobile
        run: pnpm exec turbo run build --filter=!@brain/web --filter=!@brain/mobile

  unit-tests:
    name: Unit tests (vitest) — backend + libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      # vitest across the backend TS packages (api-gateway + core-service +
      # libs). web/mobile excluded (browser/Expo harness — tracked follow-up).
      # The FULL Python suites run in the `python-tests` job below (invariant-gates
      # only exercises ~2 files via the C4/C8 behavioral checks, NOT the whole suite).
      # --passWithNoTests so packages that declare a `test` script but have no
      # test files yet (e.g. lib-logger) don't fail the gate.
      - name: turbo test (vitest) — backend + libs, excludes web/mobile
        run: pnpm exec turbo run test --filter=!@brain/web --filter=!@brain/mobile -- --passWithNoTests

  python-tests:
    name: Python unit tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-service, intelligence-service, ingestion-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
      # Full per-service pytest. These suites (PII / faithfulness / GST / parity /
      # idempotency) were previously ungated — a regression merged green. Now blocking.
      - name: pytest — ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: uv run pytest -q

  web-tests:
    name: Web unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      # apps/web vitest (jsdom) — 788 tests, previously ungated. Mobile (Expo)
      # is still a tracked follow-up.
      - name: web vitest
        run: pnpm --filter @brain/web exec vitest run

  # Tenant-isolation negative tests (advisor review P1-14). Both harnesses spin
  # their OWN disposable postgres:16-alpine via `docker run` (the ubuntu-latest
  # runner has Docker), apply the REAL service-role file, and assert the deny
  # matrix — deterministic, no live data, no DB service block needed:
  #   - db-isolation:    GRANT-level isolation + every svc_ role is NON-BYPASSRLS
  #   - rls-row-scoping: the ws_isolation RLS policy scopes ROWS at runtime
  #     (context-less read → 0; tenant A can't see/insert tenant B's rows)
  # These were runnable locally but DARK in CI; a tenancy regression could merge
  # green. Now blocking.
  tenancy-isolation:
    name: Tenant isolation (RLS + grant deny-matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GRANT-level service-role isolation
        run: bash tests/integration/db-isolation/run.sh
      - name: Runtime RLS row-scoping
        run: bash tests/integration/rls-row-scoping/run.sh

  # Migrator correctness (advisor review P1-18). Proves scripts/migrate.sh against
  # disposable postgres + clickhouse: clean from-scratch replay of every in-scope
  # migration, idempotent re-run, adopt-existing (baseline), incremental apply, and
  # drift abort. This is also the gate that a NEW migration actually replays clean —
  # the old marker-probe in dev-up.sh would silently skip it. Needs Docker; no live data.
  migrator:
    name: Schema migrator (replay + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: migrate.sh replay/idempotency/adopt/incremental/drift
        run: bash tests/integration/migrator/run.sh

  # Backend lint (advisor review P1-16). ESLint was not installed at all
  # (eslint-config was an empty stub; core-service lint = `echo lint stub`).
  # Now a real flat config (@brain/eslint-config) lints the backend TS surface
  # (api-gateway + core-service). Pragmatic baseline: real-bug rules are ERROR
  # (blocking), stylistic/explicit-any are WARN (surfaced, non-blocking) — so the
  # gate is green on the existing code today and ratchets over time.
  backend-lint:
    name: Backend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      - name: eslint — backend (api-gateway + core-service)
        run: pnpm lint:backend
