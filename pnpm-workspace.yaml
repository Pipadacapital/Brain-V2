# Explicit enumerated members — NOT apps/** glob.
# Python service dirs (ingestion-service, analytics-service, intelligence-service)
# are deliberately absent; they are uv workspace members, not pnpm members.
# Reason: pnpm globbing over Python dirs would cause a missing-package.json error.
# See DECISIONS.md §1 and TOOLCHAIN.md for the graph-aware/file-hash-aware asymmetry.
packages:
  - "apps/web"
  - "apps/mobile"
  - "apps/api-gateway"
  - "apps/core-service"
  - "apps/notifications-service"
  - "apps/lifecycle-service"
  - "packages/*"
# Single @types/react across the workspace (Slice A — feat-auth-supabase-identity).
# Adding @supabase/ssr re-hoisted @types/react@18 (from @brain/mobile / React
# Native 0.76) into the apps/web compile, breaking the React-19 type singleton
# (apps/web pins @types/react@^19). Pin to 19 so apps/web compiles against ONE
# React type. apps/mobile typechecks fine against 19. pnpm v11 reads overrides here.
overrides:
  "@types/react": "19.2.15"
allowBuilds:
  '@parcel/watcher': set this to true or false
  '@shopify/react-native-skia': true
  '@swc/core': set this to true or false
  protobufjs: true
  sharp: set this to true or false
  unrs-resolver: set this to true or false
# Dependency build scripts are blocked by default in pnpm v10+.
# esbuild ships a native binary and must run its install/build script
# (vitest + tsx depend on it). Approve it explicitly.
onlyBuiltDependencies:
  - esbuild
